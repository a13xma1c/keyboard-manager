[project]
name = "keyboardmanager"
version = "0.1.0"
description = "Create custom keyboard shortcuts, macros and automated sequences."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "pynput>=1.7.7",
    "keyboard>=0.13.5",
]

[project.scripts]
keyboardmanager = "keyboardmanager.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keyboardmanager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
