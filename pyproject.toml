[project]
name = "keyboardmanager"
dynamic = ["version"]  # single source: src/keyboardmanager/__init__.py
description = "Create custom keyboard shortcuts, macros and automated sequences."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["keyboard", "shortcuts", "macros", "hotkeys", "automation", "remapping"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
    "Topic :: Utilities",
]
dependencies = [
    "PySide6>=6.6",
    "pynput>=1.7.7",
    # crashes the interpreter on import under macOS, where it is never used
    "keyboard>=0.13.5; sys_platform != 'darwin'",
    # macOS APIs imported directly (active window, permission checks)
    "pyobjc-framework-Cocoa>=9; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=9; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=9; sys_platform == 'darwin'",
]

[project.scripts]
keyboardmanager = "keyboardmanager.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.3",
]
# only needed to build the desktop bundles: uv sync --group packaging
packaging = [
    "pyinstaller>=6.10",
]

[tool.hatch.version]
path = "src/keyboardmanager/__init__.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keyboardmanager"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "tools", "packaging", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120  # a hang (e.g. a deadlock) fails the test instead of stalling the run
timeout_method = "thread"  # also works when a thread is stuck inside Qt's C++ code
markers = [
    "native: uses the real operating-system APIs of the machine running the tests",
]
